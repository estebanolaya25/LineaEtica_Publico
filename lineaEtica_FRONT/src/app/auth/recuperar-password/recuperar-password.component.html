<div class="body">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="login-card p-4">
      <div class="text-center mb-4">
        <p class="logo-label">Canal Ético Corporativo</p>
      </div>
      <h5 class="text-center mb-3">{{ 'RECUPERACION_TITLE' | translate }}</h5>
      <form [formGroup]="form">
        <div class="form-group mb-3">
          <input type="email" class="form-control" placeholder="{{ 'Correo' | translate }}" formControlName="correoElectronico" />
        </div>
        <div class="form-group mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <canvas id="captchaCanvasR" width="200" height="50"></canvas>
            <button type="button" class="btn btn-link p-0" (click)="refreshCaptcha()">{{ 'RefrescarCaptcha' | translate }}</button>
          </div>
          <input type="text" class="form-control" placeholder="{{ 'IngreseCaptcha' | translate }}" formControlName="captcha" />
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="!form.valid || isLoading" (click)="enviar()">
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          {{ 'ENVIAR_MAIL' | translate }}
        </button>
        <a routerLink="/auth/login" class="btn btn-outline-secondary w-100">{{ 'Regresar' | translate }}</a>
      </form>
    </div>
  </div>
</div>
